<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Carrera</title>
<meta name="description" content="Fechas de exámenes y entregas, notas por materia, rendimiento académico y una frase por día.">
<meta name="theme-color" content="#04060f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Carrera">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: app de una columna para el celular, barra superior fija y navegación inferior tipo HUD. */
  /* Estética única oscura (neón sobre espacio profundo), igual que el Gestor de estudios de la PC. */
  :root {
    color-scheme: dark;
    --bg: #04060f; --bg2: #0a0f24; --panel: rgba(14,22,48,.72); --panel-solid: #0c1430;
    --line: rgba(34,228,255,.18); --fg: #e8f4ff; --muted: #8aa0c8;
    --cyan: #22e4ff; --pink: #ff3bd4; --violet: #8b5cff;
    --ok: #2dffa8; --warn: #ffb020; --bad: #ff4d6d;
    --display: "Orbitron", "Segoe UI", system-ui, sans-serif;
    --body: "Exo 2", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0; font-family: var(--body); font-size: 15px; color: var(--fg);
    background:
      radial-gradient(700px 420px at 100% -5%, rgba(139,92,255,.25), transparent 60%),
      radial-gradient(600px 400px at -10% 105%, rgba(34,228,255,.14), transparent 60%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    background-attachment: fixed;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .45;
    background-image: linear-gradient(rgba(34,228,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,228,255,.05) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: radial-gradient(ellipse at 50% 30%, #000 25%, transparent 75%);
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  header.top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px));
    background: rgba(4,6,15,.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  }
  header.top .wrap { display: flex; align-items: center; gap: 10px; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 15px; letter-spacing: .14em; text-transform: uppercase;
           background: linear-gradient(90deg, var(--cyan), var(--violet) 60%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand::before { content: "◢ "; -webkit-text-fill-color: var(--cyan); }
  .today { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  main { padding-block: 14px; }
  h2 { font-family: var(--display); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan);
       margin: 22px 0 10px; text-wrap: balance; text-shadow: 0 0 12px rgba(34,228,255,.35); }
  h2:first-child { margin-top: 4px; }
  .panel { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; backdrop-filter: blur(8px); }
  .panel + .panel { margin-top: 10px; }
  .muted { color: var(--muted); font-size: 13px; }
  .stack { display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .num { font-variant-numeric: tabular-nums; font-family: var(--mono); }

  /* frase del día */
  .quote { border: 1px solid rgba(255,59,212,.35); background: linear-gradient(135deg, rgba(255,59,212,.12), rgba(139,92,255,.10) 50%, rgba(34,228,255,.08)); }
  .quote .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--pink); text-transform: uppercase; }
  .quote p { font-size: 18px; line-height: 1.45; margin: 8px 0 10px; font-weight: 500; text-wrap: pretty; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
  .tile .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-family: var(--display); font-size: 26px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .c-cyan { color: var(--cyan); text-shadow: 0 0 14px rgba(34,228,255,.45); }
  .c-ok { color: var(--ok); text-shadow: 0 0 14px rgba(45,255,168,.35); }
  .c-warn { color: var(--warn); } .c-bad { color: var(--bad); } .c-pink { color: var(--pink); } .c-muted { color: var(--muted); }

  /* listas de eventos / notas */
  .item { display: grid; grid-template-columns: 4px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid rgba(34,228,255,.08); }
  .item:first-child { border-top: 0; padding-top: 2px; }
  .stripe { width: 4px; border-radius: 4px; align-self: stretch; }
  .item .t { font-weight: 600; overflow-wrap: anywhere; }
  .item .m { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px;
          border: 1px solid currentColor; white-space: nowrap; }
  .when { font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; }
  .bar { height: 6px; background: rgba(138,160,200,.15); border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--cyan), var(--violet)); box-shadow: 0 0 10px rgba(34,228,255,.6); }

  /* formularios */
  label.f { display: grid; gap: 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; }
  input, select, textarea {
    width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: rgba(3,6,18,.75); border: 1px solid rgba(138,160,200,.28);
    border-radius: 10px; padding: 10px 11px; outline: none; text-transform: none; letter-spacing: 0;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,228,255,.18); }
  select option { background: var(--panel-solid); }
  input[type=range] { padding: 0; accent-color: var(--cyan); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .grid2 .full { grid-column: 1 / -1; }
  button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 10px; padding: 11px 14px; color: #030512;
           background: linear-gradient(135deg, var(--cyan), var(--violet)); box-shadow: 0 0 0 1px rgba(34,228,255,.4), 0 4px 18px rgba(34,228,255,.2); }
  button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  button.ghost { background: rgba(34,228,255,.06); color: var(--cyan); box-shadow: inset 0 0 0 1px rgba(34,228,255,.45); }
  button.danger { background: rgba(255,77,109,.12); color: var(--bad); box-shadow: inset 0 0 0 1px rgba(255,77,109,.5); }
  button.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
  button.icon { padding: 6px 9px; font-size: 13px; background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px rgba(138,160,200,.3); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  details.add > summary { list-style: none; cursor: pointer; }
  details.add > summary::-webkit-details-marker { display: none; }
  .confirm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

  /* calendario */
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cal-head .mes { flex: 1; text-align: center; font-family: var(--display); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal .dow { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 4px; letter-spacing: .06em; }
  .day { aspect-ratio: 1 / 1; max-width: 100%; border-radius: 10px; background: rgba(3,6,18,.5); border: 1px solid transparent; padding: 4px 0 0;
         display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; color: var(--fg); font-size: 14px; box-shadow: none; font-weight: 500; }
  .day.out { opacity: .3; }
  .day.today { border-color: var(--cyan); box-shadow: 0 0 12px rgba(34,228,255,.35); }
  .day.sel { background: linear-gradient(135deg, rgba(34,228,255,.25), rgba(139,92,255,.25)); border-color: var(--violet); }
  .dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; }

  /* rendimiento */
  .chart { width: 100%; height: auto; display: block; }
  .chart text { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  .seg { display: flex; height: 14px; border-radius: 8px; overflow: hidden; background: rgba(138,160,200,.12); }
  .seg > span { display: block; height: 100%; }
  .mat-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(34,228,255,.08); }
  .mat-row:first-child { border-top: 0; }
  .mat-row .nm { font-weight: 600; overflow-wrap: anywhere; font-size: 14px; }
  .track { grid-column: 1 / -1; position: relative; height: 10px; background: rgba(138,160,200,.12); border-radius: 6px; }
  .track > i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
  .track > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .5; }

  /* navegación inferior */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    background: rgba(4,6,15,.9); backdrop-filter: blur(14px); border-top: 1px solid var(--line); box-shadow: 0 -1px 0 rgba(255,59,212,.25);
  }
  nav.tabs button { background: transparent; box-shadow: none; color: var(--muted); padding: 6px 2px; display: grid; justify-items: center; gap: 2px;
                    font-size: 10px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; position: relative; border-radius: 10px; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button[aria-current="page"] { color: var(--cyan); background: rgba(34,228,255,.08); text-shadow: 0 0 10px rgba(34,228,255,.6); }
  nav.tabs button[aria-current="page"] svg { filter: drop-shadow(0 0 6px rgba(34,228,255,.8)); }
  .badge { position: absolute; top: 2px; right: calc(50% - 20px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--pink);
           color: #fff; font-size: 10px; display: grid; place-items: center; box-shadow: 0 0 10px var(--pink); }
  .note { font-size: 13px; padding: 10px 12px; border-radius: 10px; border: 1px dashed rgba(255,176,32,.5); color: var(--warn); }
  .empty { text-align: center; padding: 18px 8px; color: var(--muted); font-size: 14px; }
  .empty b { color: var(--fg); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 40;
           background: var(--panel-solid); border: 1px solid var(--cyan); color: var(--fg); padding: 9px 14px; border-radius: 10px; font-size: 14px;
           box-shadow: 0 0 20px rgba(34,228,255,.35); max-width: calc(100% - 32px); }
  .view { animation: in .25s ease; }
  @keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }
  @media (max-width: 360px) { .tiles { grid-template-columns: minmax(0,1fr); } .grid2 { grid-template-columns: minmax(0,1fr); } }
  [hidden] { display: none !important; }
  html { padding-top: env(safe-area-inset-top, 0px); }
  .switch { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
</style>
</head>
<body>

<header class="top"><div class="wrap"><span class="brand">Mi Carrera</span><span class="today num" id="hoy"></span></div></header>
<main class="wrap" id="app"><p class="empty">Cargando tus datos…</p></main>
<div class="toast" id="toast" hidden></div>

<nav class="tabs" aria-label="Secciones">
  <button data-tab="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Fechas</button>
  <button data-tab="notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Notas</button>
  <button data-tab="rendimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rendim.</button>
  <button data-tab="avisos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>Avisos<span class="badge" id="badge" hidden>0</span></button>
</nav>

<script src="aviso.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- estado
const S = {
  db: null, ready: { materias: false, notas: false, eventos: false }, offline: false, readOnly: false,
  materias: [], notas: [], eventos: [], ajustes: { aprobado: 6, promocion: 8 },
  tab: "inicio", mes: null, diaSel: null, filtroMat: "", frase: 0, confirm: null,
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const TIPOS_EV = {
  examen:  { label: "Examen",  color: "var(--pink)" },
  entrega: { label: "Entrega", color: "var(--cyan)" },
  estudio: { label: "Estudio", color: "var(--violet)" },
  otro:    { label: "Otro",    color: "var(--muted)" },
};
const TIPOS_NOTA = ["Parcial 1", "Parcial 2", "Recuperatorio", "Trabajo práctico", "Coloquio", "Final", "Otro"];

// Frases propias, una por día (cambia a medianoche).
const FRASES = [
  "Un tema por día y en un mes dominás una unidad entera.",
  "El parcial no mide cuánto sabés: mide cuánto practicaste. Hoy practicá un ejercicio más.",
  "No hace falta estudiar como un genio, alcanza con estudiar como alguien que no abandona.",
  "Cada ejercicio que no te sale hoy es uno que ya no te va a sorprender en el examen.",
  "La constancia le gana al talento cuando el talento no aparece a cursar.",
  "Media hora de repaso hoy vale más que una noche entera sin dormir antes del final.",
  "Ingeniería no se aprueba de golpe: se aprueba materia por materia, tema por tema.",
  "Si una ecuación te frena, dibujala. Si el dibujo te frena, preguntá. Pero no te frenes.",
  "Tu yo del cuatrimestre que viene te va a agradecer lo que estudies esta semana.",
  "Equivocarte en la práctica es gratis. Aprovechalo.",
  "Los circuitos se resuelven con método; la carrera también.",
  "Empezá por lo que menos te gusta: después todo lo demás se siente liviano.",
  "Una nota baja es un dato, no una sentencia. Usala para ajustar la estrategia.",
  "Lo difícil de hoy es lo básico de la materia que sigue.",
  "Cerrá las redes 50 minutos. Tu cabeza rinde más de lo que creés cuando la dejás concentrarse.",
  "Estudiar en grupo duplica las ideas y divide las dudas.",
  "No necesitás ganas para empezar: las ganas aparecen después de empezar.",
  "Cada TP entregado a tiempo es una preocupación menos para el final.",
  "La termodinámica dice que todo tiende al desorden. Tu agenda no tiene por qué.",
  "Dormir bien también es estudiar: ahí se fija lo que aprendiste.",
  "Hacer un resumen es enseñarte a vos mismo. Es la mejor clase que vas a tomar.",
  "Un buen ingeniero no sabe todo: sabe dónde buscar y cómo razonarlo.",
  "Aprobar es el objetivo; entender es el atajo.",
  "Si hoy avanzaste un 10 %, en diez días terminaste. Sumá tu 10 %.",
  "Repasá lo de ayer cinco minutos antes de arrancar: tu memoria te lo va a devolver con intereses.",
  "No compares tu capítulo 2 con el capítulo 10 de otro.",
  "Las fórmulas se olvidan; los razonamientos quedan. Entendé de dónde sale cada una.",
  "Planificá el examen como un proyecto: fecha, alcance, tareas y avance diario.",
  "La diferencia entre un 6 y un 8 suele ser un repaso más de los ejercicios integradores.",
  "Celebrá cada materia aprobada: es un pedazo del título que ya nadie te saca.",
  "Hoy no tenés que estudiar todo. Tenés que estudiar lo de hoy.",
  "Cuando algo parece imposible, partilo en pasos chicos hasta que uno sea obvio.",
  "La práctica distribuida le gana al atracón: poquito y seguido.",
  "Sos la misma persona que ya aprobó materias difíciles. Va a volver a pasar.",
  "Revisá el error, no solo el resultado. Ahí está la nota que te falta.",
  "Una consulta al profe a tiempo ahorra tres tardes de dudas.",
  "Tu futuro diseño, tu futura planta, tu futuro proyecto empiezan con el apunte de hoy.",
  "Avanzar lento sigue siendo avanzar. Quedarse quieto no.",
  "Ordená tu escritorio, ordená tu semana, ordená tu cabeza. En ese orden.",
  "El mejor momento para empezar a preparar el final fue la primera clase. El segundo mejor es hoy.",
];

// ---------------------------------------------------------------- utilidades
function now() { return new Date(); }
function parseFecha(s) { const d = new Date(s); return isNaN(d) ? null : d; }
function falta(ms) {
  const h = ms / 36e5;
  if (h < 0) { const d = Math.floor(-h / 24); return d >= 1 ? `vencido hace ${d} d` : `vencido hace ${Math.max(1, Math.floor(-h))} h`; }
  if (h < 1) return `faltan ${Math.max(1, Math.round(h * 60))} min`;
  if (h < 48) return `faltan ${Math.floor(h)} h`;
  return `faltan ${Math.floor(h / 24)} días`;
}
function fechaLarga(d) { return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function matNombre(id) { return (S.materias.find(m => m.id === id) || {}).nombre || "General"; }
function fmt(n) { return n == null || isNaN(n) ? "—" : n.toFixed(2).replace(".", ","); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2400); }
function sortedMaterias() { return [...S.materias].sort((a, b) => a.nombre.localeCompare(b.nombre, "es")); }

// ---------------------------------------------------------------- cálculos de rendimiento
function notaMateria(mid) {
  const ns = S.notas.filter(n => n.materia === mid && typeof n.nota === "number");
  if (!ns.length) return null;
  const finales = ns.filter(n => n.tipo === "Final").sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  const prom = ns.filter(n => n.tipo !== "Final").reduce((s, n) => s + n.nota, 0) / (ns.filter(n => n.tipo !== "Final").length || 1);
  return { final: finales.length ? finales[0].nota : null, promedio: ns.some(n => n.tipo !== "Final") ? prom : null,
           valor: finales.length ? finales[0].nota : prom, cantidad: ns.length };
}
function estado(v) {
  const { aprobado, promocion } = S.ajustes;
  if (v == null) return { txt: "Sin notas", cls: "c-muted", color: "var(--muted)" };
  if (v >= promocion) return { txt: "Promoción", cls: "c-ok", color: "var(--ok)" };
  if (v >= aprobado) return { txt: "Aprobando", cls: "c-cyan", color: "var(--cyan)" };
  return { txt: "En riesgo", cls: "c-bad", color: "var(--bad)" };
}
function resumen() {
  const porMat = sortedMaterias().map(m => ({ m, r: notaMateria(m.id) }));
  const con = porMat.filter(x => x.r);
  const todas = S.notas.filter(n => typeof n.nota === "number");
  const general = con.length ? con.reduce((s, x) => s + x.r.valor, 0) / con.length : null;
  const aprobadas = porMat.filter(x => x.r && x.r.final != null && x.r.final >= S.ajustes.aprobado).length;
  const riesgo = con.filter(x => x.r.valor < S.ajustes.aprobado);
  const ord = [...todas].sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
  let tendencia = null;
  if (ord.length >= 4) {
    const k = Math.min(3, Math.floor(ord.length / 2));
    const ult = ord.slice(-k).reduce((s, n) => s + n.nota, 0) / k;
    const prev = ord.slice(-2 * k, -k).reduce((s, n) => s + n.nota, 0) / k;
    tendencia = ult - prev;
  }
  const mejor = con.length ? con.reduce((a, b) => (b.r.valor > a.r.valor ? b : a)) : null;
  return { porMat, con, todas, ord, general, aprobadas, riesgo, tendencia, mejor };
}
function avisos() {
  const t = now(), out = [];
  for (const e of S.eventos) {
    if (e.hecho) continue;
    const d = parseFecha(e.fecha); if (!d) continue;
    const h = (d - t) / 36e5;
    if (h < 0) out.push({ nivel: 3, e, d, msg: `Venció: ${e.titulo}`, det: `${matNombre(e.materia)} · ${fechaLarga(d)}` });
    else if (h < 48 && (e.progreso || 0) < 50) out.push({ nivel: 3, e, d, msg: `Vas atrasado: ${e.titulo}`, det: `${falta(d - t)} y vas ${e.progreso || 0} %` });
    else if (h < 48) out.push({ nivel: 2, e, d, msg: `${e.titulo}: ${falta(d - t)}`, det: `${matNombre(e.materia)} · ${fechaLarga(d)}` });
    else if (h < 24 * 7) out.push({ nivel: 1, e, d, msg: `${e.titulo}: ${falta(d - t)}`, det: `${matNombre(e.materia)} · ${fechaLarga(d)}` });
  }
  const r = resumen();
  for (const x of r.riesgo) out.push({ nivel: 2, msg: `${x.m.nombre}: promedio ${fmt(x.r.valor)}`, det: `Está debajo de ${S.ajustes.aprobado}. Reforzá antes del próximo examen.` });
  return out.sort((a, b) => b.nivel - a.nivel || ((a.d || 0) - (b.d || 0)));
}

function render() {
  $("#hoy").textContent = `${DIAS[now().getDay()]} ${now().getDate()}/${now().getMonth() + 1}`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  const av = avisos().filter(a => a.nivel >= 2).length;
  $("#badge").hidden = !av; $("#badge").textContent = av;
  const loading = !Object.values(S.ready).every(Boolean);
  let html = "";
  if (!S.storageOk) html = `<p class="note">Este navegador no deja guardar datos (¿modo incógnito?). Abrí la app normal o instalala para que tus notas no se pierdan.</p>`;
  html += ({ inicio: vInicio, calendario: vCalendario, notas: vNotas, rendimiento: vRendimiento, avisos: vAvisos }[S.tab])();
  const app = $("#app");
  const y = window.scrollY;
  // Conservar lo que se está escribiendo si llega una actualización de datos en medio.
  const keep = {}, focused = document.activeElement && document.activeElement.id;
  if (!S.skipRestore) app.querySelectorAll("form input[id], form select[id]").forEach(el => { if (el.type !== "range") keep[el.id] = el.value; });
  S.skipRestore = false;
  app.innerHTML = `<div class="view">${html}</div>`;
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) el.value = v; }
  if (focused) { const el = document.getElementById(focused); if (el && el.closest("form")) el.focus({ preventScroll: true }); }
  if (render._lastTab === S.tab) window.scrollTo(0, y); else window.scrollTo(0, 0);
  render._lastTab = S.tab;
  bindViews();
}

function eventoItem(e, conAcciones) {
  const d = parseFecha(e.fecha), tp = TIPOS_EV[e.tipo] || TIPOS_EV.otro;
  const ms = d ? d - now() : 0;
  const color = e.hecho ? "var(--ok)" : ms < 0 ? "var(--bad)" : ms < 48 * 36e5 ? "var(--warn)" : tp.color;
  const conf = S.confirm === "ev:" + e.id;
  return `<div class="item">
    <span class="stripe" style="background:${color};box-shadow:0 0 8px ${color}"></span>
    <div class="grow">
      <div class="t">${esc(e.titulo)}</div>
      <div class="m"><span class="chip" style="color:${tp.color}">${tp.label}</span> ${esc(matNombre(e.materia))}${d ? " · " + fechaLarga(d) : ""}</div>
      ${conAcciones && !e.hecho ? `<div class="row" style="margin-top:8px"><input type="range" min="0" max="100" step="10" value="${e.progreso || 0}" id="prog-${e.id}" data-prog="${e.id}" aria-label="Avance de ${esc(e.titulo)}" class="grow" style="width:auto">

        ? `<div class="confirm"><button class="sm danger" data-del-ev="${e.id}">Borrar</button><button class="sm icon" data-cancel>No</button></div>`
        : `<div class="row" style="justify-content:flex-end"><button class="sm ghost" data-done="${e.id}">${e.hecho ? "Reabrir" : "Listo"}</button><button class="sm icon" data-ask="ev:${e.id}" aria-label="Borrar">✕</button></div>`) : ""}
    </div></div>`;
}

function vCalendario() {
  const base = S.mes || new Date(now().getFullYear(), now().getMonth(), 1);
  const first = new Date(base.getFullYear(), base.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const byDay = {};
  for (const e of S.eventos) { const d = parseFecha(e.fecha); if (d) (byDay[iso(d)] ||= []).push(e); }
  let cells = ["lun","mar","mié","jue","vie","sáb","dom"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d), evs = byDay[k] || [];
    cells += `<button class="day${d.getMonth() !== base.getMonth() ? " out" : ""}${k === iso(now()) ? " today" : ""}${k === S.diaSel ? " sel" : ""}" data-day="${k}" aria-label="${d.getDate()} de ${MESES[d.getMonth()]}${evs.length ? ", " + evs.length + " fechas" : ""}">
      <span class="num">${d.getDate()}</span><span class="dots">${evs.slice(0, 4).map(e => `<i style="background:${e.hecho ? "var(--ok)" : (TIPOS_EV[e.tipo] || TIPOS_EV.otro).color}"></i>`).join("")}</span></button>`;
  }
  const lista = S.diaSel ? (byDay[S.diaSel] || []) :
    S.eventos.filter(e => !e.hecho || (parseFecha(e.fecha) && parseFecha(e.fecha) > now())).sort((a, b) => (a.fecha || "").localeCompare(b.fecha || ""));
  return `
  <h2>Calendario</h2>
  <div class="panel">
    <div class="cal-head"><button class="sm icon" data-mes="-1" aria-label="Mes anterior">◀</button>
      <span class="mes">${MESES[base.getMonth()]} ${base.getFullYear()}</span>
      <button class="sm icon" data-mes="1" aria-label="Mes siguiente">▶</button></div>
    <div class="cal">${cells}</div>
    <div class="legend">${Object.values(TIPOS_EV).slice(0, 3).map(t => `<span><i style="background:${t.color}"></i>${t.label}</span>`).join("")}<span><i style="background:var(--ok)"></i>Hecho</span></div>
  </div>
  <div style="margin-top:10px">${formEvento()}</div>
  <h2>${S.diaSel ? "Fechas del " + S.diaSel.split("-").reverse().join("/") : "Pendientes"}${S.diaSel ? ` <button class="sm icon" data-day="" style="margin-left:6px">ver todas</button>` : ""}</h2>
  <div class="panel">${lista.length ? lista.map(e => eventoItem(e, true)).join("") : `<div class="empty">${S.diaSel ? "Nada este día." : "No hay fechas pendientes."} Usá <b>+ Nueva fecha</b>.</div>`}</div>`;

function chartEvolucion(ord) {
  if (ord.length < 2) return `<div class="empty">Con <b>dos notas</b> o más aparece tu evolución en el tiempo.</div>`;
  const W = 340, H = 180, L = 26, R = 10, T = 12, B = 26;
  const xs = ord.map(n => new Date(n.fecha || 0).getTime());
  const x0 = Math.min(...xs), x1 = Math.max(...xs) || x0 + 1;
  const X = t => L + (x1 === x0 ? (W - L - R) / 2 : (t - x0) / (x1 - x0) * (W - L - R));
  const Y = v => T + (10 - v) / 10 * (H - T - B);
  let acc = 0;
  const run = ord.map((n, i) => { acc += n.nota; return [X(xs[i]), Y(acc / (i + 1))]; });
  const line = run.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${run[run.length - 1][0].toFixed(1)} ${Y(0)} L${run[0][0].toFixed(1)} ${Y(0)} Z`;
  const grid = [0, 2, 4, 6, 8, 10].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(34,228,255,.10)"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  const thr = [[S.ajustes.aprobado, "var(--warn)"], [S.ajustes.promocion, "var(--ok)"]].map(([v, c]) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="4 4" opacity=".7"/>`).join("");
  const pts = ord.map((n, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(n.nota).toFixed(1)}" r="3.2" fill="${estado(n.nota).color}" opacity=".85"><title>${esc(matNombre(n.materia))} · ${esc(n.tipo)}: ${fmt(n.nota)}</title></circle>`).join("");
  const last = run[run.length - 1];
  const fmtD = t => { const d = new Date(t); return `${d.getDate()}/${d.getMonth() + 1}`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del promedio">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22e4ff" stop-opacity=".35"/><stop offset="1" stop-color="#22e4ff" stop-opacity="0"/></linearGradient></defs>
    ${grid}${thr}<path d="${area}" fill="url(#ga)"/>
    <path d="${line}" fill="none" stroke="#22e4ff" stroke-width="2.4" style="filter:drop-shadow(0 0 4px #22e4ff)"/>
    ${pts}<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="#04060f" stroke="#22e4ff" stroke-width="2.4"/>
    <text x="${L}" y="${H - 6}">${fmtD(x0)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${fmtD(x1)}</text></svg>
    <div class="legend"><span><i style="background:var(--cyan)"></i>Promedio acumulado</span><span><i style="background:var(--warn)"></i>Aprobación ${S.ajustes.aprobado}</span><span><i style="background:var(--ok)"></i>Promoción ${S.ajustes.promocion}</span></div>`;
}

function vRendimiento() {
  const r = resumen();
  if (!r.todas.length) return `<h2>Rendimiento</h2><div class="panel empty">Acá vas a ver tu promedio, tu evolución y cómo vas en cada materia.<br><br>
    <button class="sm" data-go="notas">Cargar mi primera nota</button></div>${vUmbrales()}`;
  const tend = r.tendencia;
  const rangos = [
    ["Aplazo (< 4)", n => n < 4, "var(--bad)"], ["4 a 5,99", n => n >= 4 && n < S.ajustes.aprobado, "var(--warn)"],
    [`${S.ajustes.aprobado} a ${S.ajustes.promocion - 0.01}`.replace(".", ","), n => n >= S.ajustes.aprobado && n < S.ajustes.promocion, "var(--cyan)"],
    [`${S.ajustes.promocion} a 10`, n => n >= S.ajustes.promocion, "var(--ok)"],
  ].map(([l, f, c]) => ({ l, c, n: r.todas.filter(x => f(x.nota)).length }));
  const est = estado(r.general);
  return `
  <h2>Resumen</h2>
  <div class="tiles">
    <div class="tile"><div class="k">Promedio general</div><div class="v ${est.cls}">${fmt(r.general)}</div><div class="s">${est.txt}</div></div>
    <div class="tile"><div class="k">Tendencia</div><div class="v ${tend == null ? "" : tend >= 0 ? "c-ok" : "c-bad"}">${tend == null ? "—" : (tend >= 0 ? "▲ +" : "▼ −") + fmt(Math.abs(tend))}</div><div class="s">últimas notas vs. anteriores</div></div>
    <div class="tile"><div class="k">Notas cargadas</div><div class="v c-cyan">${r.todas.length}</div><div class="s">en ${r.con.length} materias</div></div>
    <div class="tile"><div class="k">Mejor materia</div><div class="v c-pink" style="font-size:20px">${r.mejor ? fmt(r.mejor.r.valor) : "—"}</div><div class="s" style="overflow-wrap:anywhere">${r.mejor ? esc(r.mejor.m.nombre) : ""}</div></div>
  </div>
  <h2>Evolución</h2>
  <div class="panel">${chartEvolucion(r.ord)}</div>
  <h2>Por materia</h2>
  <div class="panel">${r.porMat.map(({ m, r: x }) => {
    const v = x && x.valor, e = estado(v);
    return `<div class="mat-row"><span class="nm">${esc(m.nombre)}</span><b class="num" style="color:${e.color}">${fmt(v)}</b>
      <div class="track"><i style="width:${(v || 0) * 10}%;background:${e.color};box-shadow:0 0 10px ${e.color}"></i>
        <b style="left:${S.ajustes.aprobado * 10}%"></b><b style="left:${S.ajustes.promocion * 10}%;background:var(--ok)"></b></div></div>`;
  }).join("")}
    <div class="legend"><span>Marcas: aprobación ${S.ajustes.aprobado} y promoción ${S.ajustes.promocion}. Si cargaste un <b>Final</b>, cuenta esa nota.</span></div></div>
  <h2>Distribución de notas</h2>
  <div class="panel"><div class="seg">${rangos.filter(x => x.n).map(x => `<span style="width:${x.n / r.todas.length * 100}%;background:${x.c}" title="${x.l}: ${x.n}"></span>`).join("")}</div>
    <div class="legend">${rangos.map(x => `<span><i style="background:${x.c}"></i>${x.l}: <b class="num" style="color:var(--fg)">${x.n}</b></span>`).join("")}</div></div>
  ${vUmbrales()}`;
}

function vUmbrales() {
  return `<h2>Criterios</h2><form class="panel grid2" id="f-aj">
    <label class="f">Aprobás con<input id="aj-ap" type="number" min="1" max="10" step="0.5" value="${S.ajustes.aprobado}"></label>
    <label class="f">Promocionás con<input id="aj-pr" type="number" min="1" max="10" step="0.5" value="${S.ajustes.promocion}"></label>
    <button class="full ghost" type="submit" ${S.readOnly ? "disabled" : ""}>Guardar criterios</button></form>`;
}

function vAvisos() {
  const av = avisos();
  const icon = n => n >= 3 ? ["⚠", "var(--bad)"] : n === 2 ? ["⏳", "var(--warn)"] : ["◇", "var(--cyan)"];
  return `<h2>Avisos</h2>
  <div class="panel">${av.length ? av.map(a => { const [i, c] = icon(a.nivel); return `<div class="item"><span class="stripe" style="background:${c};box-shadow:0 0 8px ${c}"></span>
    <div><div class="t">${i} ${esc(a.msg)}</div><div class="m">${esc(a.det)}</div></div><span></span></div>`; }).join("")
    : `<div class="empty">Todo en orden. Acá aparecen las entregas y exámenes de los próximos 7 días, lo vencido y las materias en riesgo.</div>`}</div>
  ${vConfig()}`;
}

function vConfig() {
  const soporta = "Notification" in window;
  const perm = soporta ? Notification.permission : "unsupported";
  const instalada = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const imp = S.confirm === "import" && S.pendienteImport;
  return `
  <h2>Notificaciones</h2>
  <div class="panel stack">
    ${perm === "granted" ? `
      <div class="switch"><span>Fechas: 7 días, 2 días, 1 día, 6 h y 1 h antes</span><input type="checkbox" id="nt-fechas" ${S.notis.fechas ? "checked" : ""} style="width:auto"></div>
      <div class="switch"><span>Frase motivadora todos los días</span><input type="checkbox" id="nt-frase" ${S.notis.frase ? "checked" : ""} style="width:auto"></div>
      <span class="muted">Con la app cerrada, Android avisa unas cuantas veces por día. Al abrir la app se revisa todo al instante.</span>`
    : perm === "denied" ? `<span class="muted">Bloqueaste las notificaciones. Activalas desde los ajustes del celular → Apps → Mi Carrera (o del navegador) → Notificaciones.</span>`
    : soporta ? `<span>Recibí un aviso antes de cada examen o entrega y una frase cada mañana.</span><button data-notis>Activar notificaciones</button>`
    : `<span class="muted">${ios && !instalada ? "En iPhone las notificaciones funcionan una vez instalada la app (ver abajo)." : "Este navegador no permite notificaciones."}</span>`}
  </div>
  ${instalada ? "" : `<h2>Instalar en el celular</h2><div class="panel stack">
    ${S.instalar ? `<span>Instalala para abrirla desde su ícono, a pantalla completa y sin internet.</span><button data-instalar>Instalar Mi Carrera</button>`
      : ios ? `<span>En Safari tocá <b>Compartir</b> (□↑) → <b>Agregar a pantalla de inicio</b>.</span>`
      : `<span>En Chrome tocá <b>⋮</b> → <b>Instalar app</b> (o «Agregar a la pantalla principal»).</span>`}</div>`}
  <h2>Copia de seguridad</h2>
  <div class="panel stack">
    <span class="muted">Tus datos viven sólo en este celular. Bajá un respaldo de vez en cuando (y antes de cambiar de celular).</span>
    ${imp ? `<div class="note">¿Reemplazar todo por el respaldo? Tiene ${S.pendienteImport.materias.length} materias, ${S.pendienteImport.notas.length} notas y ${S.pendienteImport.eventos.length} fechas.</div>
      <div class="row"><button class="danger" data-import-ok>Sí, reemplazar</button><button class="ghost" data-cancel>Cancelar</button></div>`
    : `<div class="row"><button class="ghost" data-export>⬇ Descargar respaldo</button>
       <label class="ghost" style="display:inline-block;cursor:pointer;padding:11px 14px;border-radius:10px;color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(34,228,255,.45);font-weight:700">⬆ Restaurar<input type="file" id="f-import" accept="application/json,.json" hidden></label></div>`}
  </div>
  <p class="muted" style="text-align:center;margin-top:16px">Mi Carrera · funciona sin internet · tus datos no salen de tu celular</p>`;
}

// ---------------------------------------------------------------- acciones
async function guardar(fn, okMsg) {
  try { await fn(); S.skipRestore = true; render(); if (okMsg) toast(okMsg); revisarAvisos(); return true; }
  catch (e) {
    toast(e && e.code === "storage" ? "El celular no dejó guardar (¿sin espacio o en modo incógnito?)." : "No se pudo guardar. Probá de nuevo.");
    render();
    return false;
  }
}

function bindViews() {
  const fe = $("#f-ev");
  if (fe) {
    $("#add-ev").ontoggle = e => S.abrirEv = e.target.open;
    fe.onsubmit = async ev => {
      ev.preventDefault();
      const data = { titulo: $("#ev-titulo").value.trim(), materia: $("#ev-materia").value, tipo: $("#ev-tipo").value,
                     fecha: `${$("#ev-dia").value}T${$("#ev-hora").value}`, progreso: 0, hecho: false, creado: new Date().toISOString() };
      if (!data.titulo || !parseFecha(data.fecha)) return toast("Completá título, día y hora.");
      if (await guardar(() => S.db.collection("eventos").add(data), "Fecha guardada")) { S.abrirEv = false; S.diaSel = data.fecha.slice(0, 10); }
    };
  }
  const fn = $("#f-nota");
  if (fn) fn.onsubmit = async ev => {
    ev.preventDefault();
    const nota = parseFloat(String($("#n-nota").value).replace(",", "."));
    const data = { materia: $("#n-materia").value, tipo: $("#n-tipo").value, nota, fecha: $("#n-fecha").value, detalle: $("#n-det").value.trim(), creado: new Date().toISOString() };
    if (!data.materia) return toast("Elegí la materia.");
    if (!(nota >= 1 && nota <= 10)) return toast("La nota va de 1 a 10.");
    if (await guardar(() => S.db.collection("notas").add(data), `Nota ${fmt(nota)} guardada en ${matNombre(data.materia)}`)) S.filtroMat = data.materia;
  };
  const fm = $("#f-mat");
  if (fm) fm.onsubmit = async ev => {
    ev.preventDefault();
    const nombre = $("#m-nombre").value.trim();
    if (!nombre) return;
    await guardar(() => S.db.collection("materias").add({ nombre }), "Materia agregada");
  };
  const fa = $("#f-aj");
  if (fa) fa.onsubmit = async ev => {
    ev.preventDefault();
    const ap = parseFloat($("#aj-ap").value), pr = parseFloat($("#aj-pr").value);
    if (!(ap >= 1 && ap <= 10 && pr >= ap && pr <= 10)) return toast("Revisá los valores: la promoción no puede ser menor a la aprobación.");
    await guardar(() => S.db.doc("ajustes/general").set({ aprobado: ap, promocion: pr }), "Criterios guardados");
  };
  const fi = $("#f-import");
  if (fi) fi.onchange = () => fi.files[0] && importar(fi.files[0]);
  for (const k of ["fechas", "frase"]) {
    const c = $("#nt-" + k);
    if (c) c.onchange = () => guardar(async () => { S.notis[k] = c.checked; persistir(); }, c.checked ? "Activado" : "Desactivado");
  }
  const fil = $("#filtro-mat");
  if (fil) { fil.value = S.filtroMat; fil.onchange = () => { S.filtroMat = fil.value; render(); }; }
  document.querySelectorAll("[data-prog]").forEach(r => {
    r.oninput = () => r.nextElementSibling.textContent = r.value + "%";
    r.onchange = () => guardar(() => S.db.collection("eventos").doc(r.dataset.prog).update({ progreso: +r.value }), `Avance: ${r.value} %`);
  });
}

document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, [data-day]"); if (!t) return;
  const d = t.dataset;
  if (t.closest("nav.tabs") && d.tab) { S.tab = d.tab; S.confirm = null; render(); return; }
  if (d.go) { S.tab = d.go; if (d.go === "calendario") S.abrirEv = true; render(); return; }
  if ("otra" in d) { S.frase++; render(); return; }
  if ("notis" in d) { activarNotis(); return; }
  if ("export" in d) { exportar(); return; }
  if ("instalar" in d && S.instalar) { S.instalar.prompt(); S.instalar = null; return; }
  if ("importOk" in d && S.pendienteImport) {
    const backup = S.pendienteImport; S.pendienteImport = null; S.confirm = null;
    await guardar(async () => { aplicar(backup); persistir(); }, "Respaldo restaurado"); return;
  }
  if (d.mes) { const b = S.mes || new Date(now().getFullYear(), now().getMonth(), 1); S.mes = new Date(b.getFullYear(), b.getMonth() + +d.mes, 1); render(); return; }
  if ("day" in d) { S.diaSel = d.day && d.day !== S.diaSel ? d.day : null; render(); return; }
  if (d.ask) { S.confirm = d.ask; render(); return; }
  if ("cancel" in d) { S.confirm = null; render(); return; }
  if (d.done) { const e = S.eventos.find(x => x.id === d.done); if (e) await guardar(() => S.db.collection("eventos").doc(e.id).update({ hecho: !e.hecho, progreso: e.hecho ? e.progreso : 100 }), e.hecho ? "Reabierta" : "¡Bien! Marcada como hecha"); return; }
  if (d.delEv) { S.confirm = null; await guardar(() => S.db.collection("eventos").doc(d.delEv).delete(), "Fecha borrada"); return; }
  if (d.delNota) { S.confirm = null; await guardar(() => S.db.collection("notas").doc(d.delNota).delete(), "Nota borrada"); return; }
  if (d.delMat) {
    S.confirm = null;
    const ns = S.notas.filter(n => n.materia === d.delMat);
    await guardar(async () => { for (const n of ns) await S.db.collection("notas").doc(n.id).delete(); await S.db.collection("materias").doc(d.delMat).delete(); }, "Materia quitada");
  }
});

// ---------------------------------------------------------------- guardado local (en el celular)
const KEY = "micarrera.v1";
const MATERIAS_INICIALES = ["Electrotecnia", "Higiene y Seguridad Industrial", "Matemática para Ingeniería Electromecánica",
  "Mecánica y Mecanismos", "Tecnología Mecánica", "Termodinámica - Ing Química (P2023)", "Termodinámica Técnica"];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function datos() {
  return { version: 1, materias: S.materias, notas: S.notas, eventos: S.eventos, ajustes: S.ajustes,
           notificados: S.notificados, notis: S.notis, guardado: new Date().toISOString() };
}
function cargar() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(KEY) || "null"); S.storageOk = true; } catch { S.storageOk = false; }
  if (!d) d = { materias: MATERIAS_INICIALES.map(nombre => ({ id: uid(), nombre })), notas: [], eventos: [] };
  aplicar(d);
}
function aplicar(d) {
  S.materias = Array.isArray(d.materias) ? d.materias : [];
  S.notas = Array.isArray(d.notas) ? d.notas : [];
  S.eventos = Array.isArray(d.eventos) ? d.eventos : [];
  S.ajustes = { aprobado: 6, promocion: 8, ...(d.ajustes || {}) };
  S.notificados = d.notificados || {};
  S.notis = { fechas: true, frase: true, ...(d.notis || {}) };
}
function persistir() {
  const d = datos();
  try { localStorage.setItem(KEY, JSON.stringify(d)); S.storageOk = true; }
  catch { S.storageOk = false; throw { code: "storage" }; }
  espejo(d);
}
// Copia para el service worker: así puede avisar aunque la app esté cerrada.
async function espejo(d) {
  try {
    const c = await caches.open("micarrera-datos");
    await c.put("./__datos.json", new Response(JSON.stringify(d), { headers: { "Content-Type": "application/json" } }));
  } catch { /* sin Cache Storage: los avisos se revisan al abrir la app */ }
}
// Misma interfaz que usaban las vistas (collection/doc), ahora sobre el almacenamiento local.
const localDB = {
  collection(name) {
    return {
      add: async data => { S[name].push({ id: uid(), ...data }); persistir(); },
      doc: id => ({
        update: async data => { const x = S[name].find(o => o.id === id); if (x) Object.assign(x, data); persistir(); },
        delete: async () => { S[name] = S[name].filter(o => o.id !== id); persistir(); },
      }),
    };
  },
  doc(path) { return { set: async data => { if (path === "ajustes/general") S.ajustes = { ...data }; persistir(); } }; },
};

// ---------------------------------------------------------------- notificaciones
async function swReg() { try { return "serviceWorker" in navigator ? await navigator.serviceWorker.ready : null; } catch { return null; } }
async function notificar(titulo, cuerpo, tag) {
  const opts = { body: cuerpo, tag, icon: "icon-192.png", badge: "icon-badge.png", lang: "es" };
  const reg = await swReg();
  if (reg) return reg.showNotification(titulo, opts);
  try { new Notification(titulo, opts); } catch { /* sin soporte */ }
}
async function revisarAvisos() {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  // Unir lo que ya avisó el service worker con la app cerrada.
  try {
    const r = await (await caches.open("micarrera-datos")).match("./__notificados.json");
    if (r) Object.assign(S.notificados, await r.json());
  } catch {}
  let cambio = false;
  if (S.notis.fechas) for (const n of AVISO.pendientes(datos(), S.notificados, new Date())) {
    await notificar(n.titulo, n.cuerpo, n.tag);
    n.keys.forEach(k => S.notificados[k] = Date.now()); cambio = true;
  }
  if (cambio) { try { persistir(); } catch {} }
}
async function activarNotis() {
  if (!("Notification" in window)) return toast("Este navegador no permite notificaciones. Instalá la app primero (ver abajo).");
  const p = await Notification.requestPermission();
  if (p !== "granted") { render(); return toast("Sin permiso no puedo avisarte. Podés activarlo en los ajustes del navegador."); }
  const reg = await swReg();
  if (reg && "periodicSync" in reg) {
    try { await reg.periodicSync.register("avisos", { minInterval: 4 * 3600 * 1000 }); } catch { /* sólo en app instalada */ }
  }
  await notificar("¡Avisos activados!", "Te voy a avisar 7 días, 2 días, 1 día, 6 horas y 1 hora antes de cada fecha.", "bienvenida");
  render(); revisarAvisos();
}

// ---------------------------------------------------------------- copia de seguridad
function exportar() {
  const blob = new Blob([JSON.stringify(datos(), null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `mi-carrera-respaldo-${iso(now())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("Respaldo descargado. Guardalo en Drive o mandátelo por mail.");
}
async function importar(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.materias) || !Array.isArray(d.notas) || !Array.isArray(d.eventos)) throw new Error();
    S.pendienteImport = d; S.confirm = "import"; render();
  } catch { toast("Ese archivo no es un respaldo de Mi Carrera."); }
}

// ---------------------------------------------------------------- arranque
S.db = localDB;
cargar();
{ const h = location.hash.slice(1); if (["inicio", "calendario", "notas", "rendimiento", "avisos"].includes(h)) { S.tab = h; if (h === "calendario") S.abrirEv = true; } }
Object.keys(S.ready).forEach(k => S.ready[k] = true);
try { if (!localStorage.getItem(KEY)) persistir(); else espejo(datos()); } catch {}
render();
setInterval(() => { if (!document.querySelector("input:focus, select:focus")) render(); revisarAvisos(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { render(); revisarAvisos(); } });
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").then(() => revisarAvisos()).catch(() => {});
}
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.instalar = e; render(); });
window.addEventListener("appinstalled", () => { S.instalar = null; toast("¡App instalada!"); render(); });
</script>
